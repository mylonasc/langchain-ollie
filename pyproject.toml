[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "langchain-ollie"
version = "0.1.0"
description = "Local tracing and evaluation for LangGraph and Deep Agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "langchain-core>=1.8.0,<1.9",
]

[project.urls]
Repository = "https://github.com/mylonasc/langchain-ollie"
Issues = "https://github.com/mylonasc/langchain-ollie/issues"
Changelog = "https://github.com/mylonasc/langchain-ollie/blob/main/CHANGELOG.md"

[project.optional-dependencies]
resources = ["psutil>=7.0,<9"]
otel = ["opentelemetry-sdk>=1.38,<2", "opentelemetry-exporter-otlp-proto-http>=1.38,<2"]
examples = [
    "langgraph>=1.2.21,<1.3",
]

[dependency-groups]
otel = ["opentelemetry-sdk>=1.38,<2", "opentelemetry-exporter-otlp-proto-http>=1.38,<2"]
dev = [
    "langgraph>=1.2.21,<1.3",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.0",
    "ty>=0.0.1a21",
]
agents = [
    "deepagents>=0.7.38,<0.8",
]
resources = ["psutil>=7.0,<9"]

# Keep this repository self-contained even when cloned below another uv workspace.
[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not perfetto and not otel'"
markers = [
    "perfetto: requires explicitly provisioned pinned Trace Processor binary",
    "otel: optional SDK and isolated loopback OTLP integration suite",
]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["langchain_ollie"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src/langchain_ollie", "tests"]
