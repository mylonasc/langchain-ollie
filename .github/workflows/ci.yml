name: Quality and offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        dependencies: [minimum, locked, current]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Resolve current supported versions
        if: matrix.dependencies == 'current'
        run: uv lock --upgrade
      - run: uv sync --locked --group dev --group agents --group resources --group otel
      - name: Pin minimum supported framework versions
        if: matrix.dependencies == 'minimum'
        run: uv pip install 'langchain-core==1.8.0' 'langgraph==1.2.21' 'deepagents==0.7.38'
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ty check
      - run: uv run --no-sync pytest --cov=langchain_ollie
      - run: uv build --out-dir dist
      - name: Install wheel and import outside checkout
        shell: bash
        run: |
          uv venv --python '${{ matrix.python }}' /tmp/wheel-smoke
          uv pip install --python /tmp/wheel-smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/wheel-smoke/bin/python -c 'import langchain_ollie'
          uv pip install --python /tmp/wheel-smoke/bin/python 'langgraph>=1.2.21,<1.3'
          uv pip install --python /tmp/wheel-smoke/bin/python 'deepagents>=0.7.38,<0.8'
          if [[ '${{ matrix.dependencies }}' == 'minimum' ]]; then
            uv pip install --python /tmp/wheel-smoke/bin/python 'langchain-core==1.8.0' 'langgraph==1.2.21' 'deepagents==0.7.38'
          fi
          mkdir /tmp/wheel-work
          cd /tmp/wheel-work
          /tmp/wheel-smoke/bin/python "$GITHUB_WORKSPACE/scripts/wheel_smoke.py" "$GITHUB_WORKSPACE"
  perfetto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
          python-version: '3.12'
      - run: uv sync --locked --group dev --group agents --group resources
      - name: Provision pinned and checksum-verified importer
        run: uv run --no-sync python scripts/install_perfetto.py /tmp/trace_processor_shell
      - name: Real agent artifacts and importer SQL assertions
        env:
          PERFETTO_TRACE_PROCESSOR: /tmp/trace_processor_shell
        run: uv run --no-sync pytest -m perfetto
  otel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
          python-version: '3.12'
      - run: uv sync --locked --group dev --group agents --group resources --group otel
      - name: Required SDK dependency preflight
        run: uv run --no-sync python -c 'import opentelemetry.sdk; import opentelemetry.exporter.otlp.proto.http.trace_exporter'
      - name: SDK and isolated loopback collector tests
        run: uv run --no-sync pytest -m otel
      - run: uv run --no-sync python examples/local_otel.py /tmp/otel-local.json
