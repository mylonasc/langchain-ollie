name: Quality and offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        dependencies: [locked, current]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Resolve current supported versions
        if: matrix.dependencies == 'current'
        run: uv lock --upgrade
      - run: uv sync --locked --group dev --group agents
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ty check
      - run: uv run --no-sync pytest --cov=langgraph_instrumentation
      - run: uv build --out-dir dist
      - name: Install wheel and import outside checkout
        shell: bash
        run: |
          uv venv --python '${{ matrix.python }}' /tmp/wheel-smoke
          uv pip install --python /tmp/wheel-smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/wheel-smoke/bin/python -c 'import langgraph_instrumentation'
          uv pip install --python /tmp/wheel-smoke/bin/python 'langgraph>=1.2.21,<1.3'
          /tmp/wheel-smoke/bin/python "$GITHUB_WORKSPACE/examples/local_agent.py" /tmp/wheel-trace.json
          uv pip install --python /tmp/wheel-smoke/bin/python 'deepagents>=0.7.38,<0.8'
          /tmp/wheel-smoke/bin/python "$GITHUB_WORKSPACE/examples/local_deep_agent.py" /tmp/wheel-deep-agent-trace.json
  perfetto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
          python-version: '3.12'
      - run: uv sync --locked --group dev --group agents
      - name: Provision pinned and checksum-verified importer
        run: uv run --no-sync python scripts/install_perfetto.py /tmp/trace_processor_shell
      - name: Real agent artifacts and importer SQL assertions
        env:
          PERFETTO_TRACE_PROCESSOR: /tmp/trace_processor_shell
        run: uv run --no-sync pytest -m perfetto
